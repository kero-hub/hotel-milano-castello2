<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbrature NFC · Alloggiato KM Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">

<div id="toast" class="fixed top-4 right-4 z-50 space-y-2"></div>

<header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20 shadow-sm">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-600 text-white flex items-center justify-center">
        <i class="fa-solid fa-id-card-clip"></i>
      </div>
      <div>
        <div class="text-sm font-black text-amber-600 uppercase tracking-wider">Alloggiato KM Manager</div>
        <div class="text-xs text-slate-500">Timbrature NFC · Hotel Milano Castello</div>
      </div>
    </div>
    <span id="ws-status" class="px-2.5 py-1 text-[11px] font-semibold rounded-lg bg-rose-50 text-rose-600 border border-rose-200">Bridge OFF</span>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6 space-y-5">

  <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 text-center shadow-sm">
    <div id="icon" class="w-20 h-20 mx-auto rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-3xl text-slate-400 mb-3">
      <i class="fa-solid fa-wifi"></i>
    </div>
    <h1 class="text-lg font-bold">Avvicina il cartellino all’ACR122</h1>
    <p class="text-xs text-slate-500 mt-1">Python <code>nfc_bridge.py</code> deve essere avviato sul PC</p>
    <div class="mt-4 text-sm">
      <span class="text-slate-500">Ultimo UID:</span>
      <span id="last-uid" class="font-mono font-semibold">—</span>
    </div>
  </section>

  <section id="result-box" class="hidden bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm">
    <div id="result-title" class="text-base font-bold mb-2">—</div>
    <div id="result-detail" class="text-sm text-slate-600 dark:text-slate-300 whitespace-pre-wrap"></div>
  </section>

  <!-- Nuova tessera -->
  <section id="create-box" class="hidden bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-2xl p-5">
    <h2 class="text-sm font-bold text-amber-800 dark:text-amber-200 mb-2">
      <i class="fa-solid fa-user-plus"></i> Tessera nuova — crea dipendente
    </h2>
    <p class="text-xs text-slate-600 dark:text-slate-300 mb-3">UID: <span id="new-uid" class="font-mono font-semibold"></span></p>
    <input id="new-name" type="text" placeholder="Nome e cognome dipendente" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm mb-3">
    <button type="button" onclick="creaETimbra()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-xl">
      Salva dipendente e timbra IN
    </button>
  </section>

  <section class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-xs font-bold uppercase text-slate-500">Log</h3>
      <button type="button" onclick="document.getElementById('log').innerHTML=''" class="text-[11px] text-slate-400">Pulisci</button>
    </div>
    <div id="log" class="text-[11px] font-mono text-slate-600 dark:text-slate-400 max-h-48 overflow-y-auto space-y-1"></div>
  </section>
</main>

<footer class="border-t border-slate-200 dark:border-slate-700 py-3 text-center text-[11px] text-slate-500">
  Copyright © Alloggiati KM Manager | All rights reserved
</footer>

<script>
  // ←←← URL App Web Apps Script (/exec)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwgeaYGpsShHBoLHycMA3zkgdawZ4w-TSyZZ4Z5tM_8W_pzN79XciSLiGpjBV_U66Mf/exec';
  const WS_URL = 'ws://127.0.0.1:8765';

  let pendingUid = '';
  let busy = false;

  function toast(msg, type) {
    const c = document.getElementById('toast');
    const d = document.createElement('div');
    d.className = 'px-4 py-2 rounded-xl text-xs font-medium text-white shadow-lg ' + (type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800');
    d.textContent = msg;
    c.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }

  function log(msg) {
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString('it-IT');
    el.innerHTML = '<div><span class="text-slate-400">[' + t + ']</span> ' + msg + '</div>' + el.innerHTML;
  }

  function setWs(ok) {
    const el = document.getElementById('ws-status');
    el.textContent = ok ? 'Bridge ON' : 'Bridge OFF';
    el.className = 'px-2.5 py-1 text-[11px] font-semibold rounded-lg border ' + (ok
      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
      : 'bg-rose-50 text-rose-600 border-rose-200');
    const icon = document.getElementById('icon');
    icon.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-3 ' + (ok
      ? 'bg-amber-50 text-amber-500 animate-pulse'
      : 'bg-slate-100 dark:bg-slate-700 text-slate-400');
  }

  async function apiPost(payload) {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    try { return JSON.parse(text); } catch (e) { throw new Error('Risposta non valida dallo script'); }
  }

  async function onCard(uid) {
    if (!uid || busy) return;
    uid = String(uid).toUpperCase().replace(/\s+/g, '');
    document.getElementById('last-uid').textContent = uid;
    pendingUid = uid;
    busy = true;
    document.getElementById('create-box').classList.add('hidden');

    try {
      if (!SCRIPT_URL || SCRIPT_URL.indexOf('INCOLLA_') === 0) {
        throw new Error('Configura SCRIPT_URL con l’URL App Web');
      }

      const r = await apiPost({ action: 'timbra', uid: uid, operatore: 'NFC-PC' });

      if (r.needCreate) {
        document.getElementById('new-uid').textContent = uid;
        document.getElementById('new-name').value = '';
        document.getElementById('create-box').classList.remove('hidden');
        document.getElementById('result-box').classList.add('hidden');
        toast('Tessera nuova: inserisci il nome', 'info');
        log('Nuova tessera ' + uid);
        return;
      }

      if (!r.ok) throw new Error(r.error || 'Errore timbratura');

      const t = r.timbratura;
      const isIn = t.tipo === 'IN';
      document.getElementById('result-box').classList.remove('hidden');
      document.getElementById('result-title').textContent = (isIn ? '🟢 INGRESSO' : '🔴 USCITA') + ' — ' + t.nome;
      document.getElementById('result-detail').textContent =
        'Tipo: ' + t.tipo + '\nData: ' + t.data + '\nOra: ' + t.ora + '\nUID: ' + t.uid;
      document.getElementById('icon').className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-3 ' +
        (isIn ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500');
      toast(t.nome + ' → ' + t.tipo, 'success');
      log(t.tipo + ' ' + t.nome + ' ' + t.ora);
    } catch (err) {
      toast(err.message || 'Errore', 'error');
      log('ERR: ' + (err.message || err));
    } finally {
      busy = false;
    }
  }

  async function creaETimbra() {
    const nome = document.getElementById('new-name').value.trim();
    if (!nome) { toast('Inserisci il nome', 'error'); return; }
    if (!pendingUid) return;
    busy = true;
    try {
      const r = await apiPost({
        action: 'timbra',
        uid: pendingUid,
        nome: nome,
        tipo: 'IN',
        operatore: 'NFC-PC'
      });
      if (!r.ok) throw new Error(r.error || 'Errore creazione');
      document.getElementById('create-box').classList.add('hidden');
      const t = r.timbratura;
      document.getElementById('result-box').classList.remove('hidden');
      document.getElementById('result-title').textContent = '🟢 INGRESSO — ' + t.nome + ' (nuovo)';
      document.getElementById('result-detail').textContent =
        'Dipendente creato e timbrato\nTipo: IN\nData: ' + t.data + '\nOra: ' + t.ora + '\nUID: ' + t.uid;
      toast('Dipendente creato: ' + t.nome, 'success');
      log('Creato ' + t.nome + ' + IN');
    } catch (err) {
      toast(err.message || 'Errore', 'error');
    } finally {
      busy = false;
    }
  }

  function connectWs() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      setWs(true);
      log('Bridge collegato');
    };
    ws.onclose = function () {
      setWs(false);
      log('Bridge disconnesso — riprovo...');
      setTimeout(connectWs, 3000);
    };
    ws.onerror = function () { log('Errore WebSocket'); };
    ws.onmessage = function (ev) {
      let data;
      try { data = JSON.parse(ev.data); } catch (e) { return; }
      if (data.event === 'card' && data.uid) onCard(data.uid);
      if (data.event === 'hello') log(data.message || 'hello');
    };
  }

  connectWs();
</script>
</body>
</html>
